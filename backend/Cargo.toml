[package]
name = "feeder"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json"] }
http = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
feed-rs = "2"
futures-util = "0.3"
url = "2"
html2text = "0.16"
html5ever = "0.38"
getrandom = "0.2"
sha2 = "0.11.1"
subtle = "2"
quick-xml = "0.41"
ring = "0.17"
base64 = "0.22"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "feeder"
path = "src/main.rs"
